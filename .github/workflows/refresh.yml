name: refresh

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      channels:
        description: "Space-separated channels to refresh (empty: all)"
        required: false
        default: ""

concurrency: refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository_owner == 'codgician'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      # Trees and metadata are built inside a bubblewrap FHS view nested in the Nix sandbox;
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor by default.
      - name: Allow nested user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Refresh channels
        id: refresh
        continue-on-error: true
        env:
          CHANNELS: ${{ inputs.channels }}
        run: |
          # shellcheck disable=SC2086 # CHANNELS is a space-separated list
          nix run .#refresh -- --summary "$GITHUB_STEP_SUMMARY" $CHANNELS

      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain channels)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add channels
            git commit -m "bot: refresh channels"
            git push
          else
            echo "Channels are up to date."
          fi

      - name: Report failed channels
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "Some channels could not be refreshed and keep their previous lock; see the job summary."
          exit 1
